[workspace]
resolver = "2"
members = [
    "crates/hermetic-protocol",
    "crates/hermetic-core",
    "crates/hermetic-terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TheSolAI/hermetic"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 2
