# Mechanically tiny profile — used to exercise the bridge's control flow
# (question → answer → apply → re-ask → exit) without paying for a real
# optimisation run. Dataset slices are shrunk so the run finishes in ~1 min.
#
# NOT for producing a usable model: the tiny slices make the scores
# meaningless. Use profiles/fast-test.toml or upstream's own profiles for that.

dtypes = ["auto", "bfloat16", "float32"]
quantization = "none"
device_map = "auto"
offload_outputs_to_cpu = true

batch_size = 2
max_batch_size = 4
max_response_length = 16

n_trials = 1
n_startup_trials = 1
study_checkpoint_dir = "checkpoints"
modified_model_type = "decensored"
max_shard_size = "5GB"

scorers = [
  { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "minimize" },
]

modifiers = [
  { plugin = "heretic.modifiers.ara.ARA" },
]

[batch_size_test_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:8]"
column = "text"

[[response_prefix_test_prompts]]
dataset = "mlabonne/harmless_alpaca"
split = "train[:8]"
column = "text"

[[response_prefix_test_prompts]]
dataset = "mlabonne/harmful_behaviors"
split = "train[:8]"
column = "text"

[scorer.KeywordRate.prompts]
dataset = "mlabonne/harmful_behaviors"
split = "test[:10]"
column = "text"

[modifier.ARA]
preserve_row_magnitudes = true
lora_rank = 4
n_optimization_steps = 1
learning_rate = 1.0
max_iter = 5
history_size = 5
print_loss = false

[modifier.ARA.good_prompts]
dataset = "mlabonne/harmless_alpaca"
split = "train[:8]"
column = "text"

[modifier.ARA.bad_prompts]
dataset = "mlabonne/harmful_behaviors"
split = "train[:8]"
column = "text"
